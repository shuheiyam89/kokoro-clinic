<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2b2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>こころ診療所 ～ささやきカルテ～</title>
<meta name="description" content="宇宙ステーションの心療クリニックで、悩みをかかえた宇宙人の患者さんと、自分の言葉で会話して「隠している真実」を探すドット絵アドベンチャー。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shuheiyam89.github.io/kokoro-clinic/">
<meta property="og:title" content="こころ診療所 ～ささやきカルテ～">
<meta property="og:description" content="宇宙ステーションの心療クリニックで、悩みをかかえた宇宙人の患者さんと、自分の言葉で会話して「隠している真実」を探すドット絵アドベンチャー。">
<meta property="og:image" content="https://shuheiyam89.github.io/kokoro-clinic/img/share.png">
<meta name="twitter:card" content="summary_large_image">
<script>
// 古い版がブラウザに残っていたら、最新版を読み直す
(function () {
  var V = '28'; window.V = V;
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (v) {
    v = v.trim();
    if (v && v !== V && sessionStorage.getItem('kokoro_reload') !== v) {
      sessionStorage.setItem('kokoro_reload', v);
      location.replace(location.pathname + '?v=' + v);
    }
  }).catch(function () {});
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="scr-title" class="screen">
    <div class="title-art"><canvas id="cv-title"></canvas></div>
    <div class="title-box">
      <p class="title-sub">宇宙ステーションの</p>
      <h1><img class="logo" src="img/logo.png?v=28" alt="こころ診療所 ～ささやきカルテ～"></h1>
      <button class="btn big" id="btn-start">はじめる</button>
      <div class="title-links">
        <button class="btn ghost" id="btn-howto">あそびかた</button>
        <button class="btn ghost" id="btn-opening">オープニング</button>
        <button class="btn ghost music-btn">🎵 BGM</button>
        <button class="btn ghost" id="btn-feedback">📝 感想</button>
      </div>
    </div>
  </section>

  <!-- オープニング -->
  <section id="scr-opening" class="screen active">
    <canvas id="cv-op"></canvas>
    <button class="skip" id="btn-skip">スキップ ▶▶</button>
    <div class="op-box" id="op-box"><canvas id="cv-op-nurse" width="56" height="56"></canvas><p id="op-text"></p><span class="op-next">▼</span></div>
  </section>

  <!-- 予約リスト -->
  <section id="scr-select" class="screen">
    <header class="bar"><button class="icon" id="btn-sel-back">←</button><h2>本日の予約</h2><button class="icon music-btn small">🎵</button></header>
    <p class="sel-lead">あなたはカウンセラー。今日も、悩みをかかえたお客様がやってくる。</p>
    <ul id="patient-list"></ul>
  </section>

  <!-- 診察 -->
  <section id="scr-session" class="screen">
    <header class="bar">
      <button class="icon" id="btn-quit">←</button>
      <div class="who"><b id="s-name"></b><small id="s-species"></small></div>
      <div class="meters">
        <div class="trust" id="s-trust" aria-label="信頼度"></div>
        <div class="anger" id="s-anger" aria-label="怒りメーター"><span class="ico">💢</span><span class="gauge"><i id="s-anger-fill"></i></span></div>
      </div>
    </header>
    <div class="stage">
      <canvas id="cv-scene"></canvas>
      <div class="phase-tag" id="phase-tag"></div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="dialog" id="dialog">
      <div class="nametag" id="d-name"></div>
      <canvas id="cv-nurse" width="56" height="56"></canvas>
      <p id="d-text"></p>
      <span class="next" id="d-next">▼</span>
    </div>
    <div class="tools">
      <button class="tool" id="btn-karte">📋 カルテ<i id="karte-badge"></i></button>
      <button class="tool" id="btn-log">💬 ログ</button>
      <button class="tool hint" id="btn-hint" disabled>💡 ヒント</button>
      <button class="tool music-btn small">🎵</button>
    </div>
    <form class="inputbar" id="form">
      <input id="inp" type="text" autocomplete="off" enterkeyhint="send" placeholder="（会話を聞いています…）" maxlength="80">
      <button class="btn send" id="btn-send" type="submit">送信</button>
    </form>
  </section>

  <!-- モーダル -->
  <div class="modal" id="modal"><div class="sheet"><div id="modal-body"></div><button class="btn" id="modal-close">とじる</button></div></div>

</div>
<script src="js/data-patients.js?v=28"></script>
<script src="js/data-flow.js?v=28"></script>
<script src="js/engine.js?v=28"></script>
<script src="js/story.js?v=28"></script>
<script src="js/ai.js?v=28"></script>
<script src="js/audio.js?v=28"></script>
<script src="js/pixel.js?v=28"></script>
<script src="js/ui.js?v=28"></script>
</body>
</html>
